[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atomity-review-workflow"
version = "0.1.0"
description = "Atomity Engineering Challenge Task 4: Resumable Review Workflow with LangGraph"
authors = [
    { name = "Om Chauhan" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.0",
    "langgraph-checkpoint>=4.3.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
workflow = "workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
